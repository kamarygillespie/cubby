name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    # The build and e2e tests point at the local Supabase stack started below.
    # These are the Supabase CLI's fixed local-dev defaults (public, identical
    # for every project) — the same values playwright.config.ts uses.
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # Edge Functions run on Deno, not Node — checked and tested separately.
      # Must run from inside the function's own directory so Deno resolves
      # its deno.json import map; from the repo root it can't find it.
      - name: Check and test link-autofill Edge Function
        working-directory: supabase/functions/link-autofill
        run: |
          deno check index.ts
          deno test --allow-net --allow-read

      # lib/db/ integration tests run against a real local Supabase stack
      # (RLS + triggers exercised for real), not mocks — see TESTING.md.
      - run: npx supabase start

      - run: npm run test

      - run: npm run build

      # Critical-path e2e (TESTING.md): real browser against the build above
      # and the local Supabase stack. A release gate — failures block merge.
      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
