name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # Edge Functions run on Deno, not Node — checked and tested separately.
      - run: deno check supabase/functions/link-autofill/index.ts

      - run: deno test --allow-net --allow-read supabase/functions/link-autofill

      # lib/db/ integration tests run against a real local Supabase stack
      # (RLS + triggers exercised for real), not mocks — see TESTING.md.
      - run: npx supabase start

      - run: npm run test

      - run: npm run build
